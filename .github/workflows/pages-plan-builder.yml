name: Pages - Install Plan Builder

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "web-plan-builder/**"
      - ".github/workflows/pages-plan-builder.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-plan-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-plan-builder/package.json

      - name: Install dependencies
        working-directory: web-plan-builder
        run: npm install

      - name: Build
        working-directory: web-plan-builder
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-plan-builder/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

