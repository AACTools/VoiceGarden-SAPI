name: MSBuild

on:
  push:
    branches: [ "master", "**" ]
    tags: ["v[0-9]**"]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  build-sherpa-config:
    name: Build SherpaOnnxConfig
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build SherpaOnnxConfig (self-contained, x64)
      run: dotnet publish SherpaOnnxConfig\SherpaOnnxConfig.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ${{github.workspace}}\sherpa-config

    - name: Verify Sherpa integration checks
      shell: pwsh
      run: |
        .\scripts\verify-sherpa-integration.ps1 -SkipBuild

    - name: Upload SherpaOnnxConfig artifact
      uses: actions/upload-artifact@v6
      with:
        name: sherpa-onnx-config
        path: |
          sherpa-config/SherpaOnnxConfig.exe
          sherpa-config/merged_models.json

  build-utilities:
    name: Build submodules
    runs-on: windows-latest
    needs: build-sherpa-config

    permissions:
      contents: read

    strategy:
      matrix:
        platform: [x86, x64, ARM64]

    steps:
    - name: Checkout submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build AzureSpeechSDKShim
      if: matrix.platform != 'ARM64'
      working-directory: ${{github.workspace}}
      run: |
        nuget restore AzureSpeechSDKShim
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{matrix.platform}} /p:OutDir=${{github.workspace}}\out\ AzureSpeechSDKShim

    - name: Build TtsApplication (non Win32)
      if: matrix.platform != 'x86'
      working-directory: ${{github.workspace}}
      run: |
        nuget restore TtsApplication
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{matrix.platform}} /p:OutDir=${{github.workspace}}\out\ TtsApplication\TtsApplication.sln

    - name: Build TtsApplication (Win32)
      # We have to use Win32 instead of x86 for this project.
      if: matrix.platform == 'x86'
      working-directory: ${{github.workspace}}
      run: |
        nuget restore TtsApplication
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=Win32 /p:OutDir=${{github.workspace}}\out\ TtsApplication\TtsApplication.sln

    - name: Build Arm64XForwarder (ARM64 only)
      if: matrix.platform == 'ARM64'
      working-directory: ${{github.workspace}}
      run: |
        nuget restore Arm64XForwarder -SolutionDirectory .
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=ARM64EC /p:OutDir=${{github.workspace}}\out\ Arm64XForwarder

    - name: Build Installer (x86 only)
      if: matrix.platform == 'x86'
      working-directory: ${{github.workspace}}
      run: |
        nuget restore Installer -SolutionDirectory .
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=Win32 /p:OutDir=${{github.workspace}}\out\ Installer
        Copy-Item -Path out\Installer.exe -Destination out\InstallPlanRunner.exe -Force

    - name: Download SherpaOnnxConfig and copy to utilities output
      if: matrix.platform == 'x86' || matrix.platform == 'x64'
      uses: actions/download-artifact@v4
      with:
        name: sherpa-onnx-config
        path: ${{github.workspace}}\out\

    - name: Run Installer plan fixture regression tests (x86)
      if: matrix.platform == 'x86'
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        .\scripts\test-installer-cli.ps1 -RepoRoot ${{github.workspace}}

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: utilities-${{matrix.platform}}
        path: out

  build-main:
    name: Build NaturalVoiceSAPIAdapter
    runs-on: windows-latest

    permissions:
      contents: read

    strategy:
      matrix:
        platform: [x86, x64, ARM64]

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download SherpaOnnx dependencies
      shell: pwsh
      run: |
        $platform = "${{matrix.platform}}"
        if ($platform -eq "x86") { $platform = "x86" }
        .\download-sherpa-deps.ps1 -Platforms $platform

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{github.workspace}}
      run: nuget restore NaturalVoiceSAPIAdapter -SolutionDirectory .

    - name: Build
      working-directory: ${{github.workspace}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{matrix.platform}} /p:OutDir=${{github.workspace}}\out\ /p:RegisterOutput=false . /t:NaturalVoiceSAPIAdapter

    - name: Compile Sherpa smoke test (x64)
      if: matrix.platform == 'x64'
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        .\scripts\run-sherpa-smoke-test.ps1 -CompileOnly
      
    - name: Remove unnecessary DLLs
      # Remove the codec DLL because it can trigger the 'GStreamer DLL not found' error
      # However the codec DLL might not exist, so ignore the error code
      working-directory: ${{github.workspace}}\out
      shell: pwsh
      run: |
        $vspath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -property installationPath -latest
        $msvcpath = (Get-ChildItem "$vspath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName
        $dumpbinpath = "$msvcpath\bin\Hostx86\x86\dumpbin.exe"
        $dlls = & $dumpbinpath /dependents NaturalVoiceSAPIAdapter.dll Microsoft.CognitiveServices.*.dll `
          | ? { $_ -like "    *.dll" } | % { $_.Trim() } | Select-Object -Unique
        $dlls += "NaturalVoiceSAPIAdapter.dll", "Microsoft.CognitiveServices.*.dll"
        # Keep SherpaOnnx runtime dependencies in release artifacts.
        $dlls += "sherpa-onnx-c-api.dll", "onnxruntime.dll", "onnxruntime_providers_shared.dll"
        Remove-Item * -Include *.dll -Exclude $dlls
        Remove-Item Microsoft.CognitiveServices.Speech.extension.codec.dll -ErrorAction Ignore
        exit 0   # This is necessary because "-ErrorAction Ignore" doesn't ensure a zero exit code

    - name: Copy ucrtbase.dll (x64)
      if: matrix.platform == 'x64'
      working-directory: ${{github.workspace}}
      shell: pwsh
      run: Copy-Item -Path "$env:SystemRoot\System32\ucrtbase.dll" -Destination out\

    - name: Copy ucrtbase.dll (x86)
      if: matrix.platform == 'x86'
      working-directory: ${{github.workspace}}
      shell: pwsh
      run: Copy-Item -Path "$env:SystemRoot\SysWOW64\ucrtbase.dll" -Destination out\

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: main-${{matrix.platform}}
        path: out

  build-setup:
    name: Build MSI setup
    runs-on: windows-latest
    needs: [build-sherpa-config, build-utilities, build-main]

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        path: ${{github.workspace}}\artifacts

    - name: Compose setup payload
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        New-Item -ItemType Directory -Force -Path payload\x86 | Out-Null
        New-Item -ItemType Directory -Force -Path payload\x64 | Out-Null
        New-Item -ItemType Directory -Force -Path payload\ARM64 | Out-Null
        Copy-Item artifacts\utilities-x86\* payload\x86\ -Recurse -Force
        Copy-Item artifacts\main-x86\* payload\x86\ -Recurse -Force
        Copy-Item artifacts\utilities-x64\* payload\x64\ -Recurse -Force
        Copy-Item artifacts\main-x64\* payload\x64\ -Recurse -Force
        Copy-Item artifacts\utilities-ARM64\* payload\ARM64\ -Recurse -Force
        Copy-Item artifacts\main-ARM64\* payload\ARM64\ -Recurse -Force
        Copy-Item payload\x86\Installer.exe payload\Installer.exe -Force
        Copy-Item payload\x86\InstallPlanRunner.exe payload\InstallPlanRunner.exe -Force

    - name: Build MSI
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        .\scripts\build-setup.ps1 -PayloadDir .\payload -OutputDir .\installer-output

    - name: Build setup.exe bootstrapper
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        .\scripts\build-bootstrapper.ps1 -MsiPath .\installer-output\NaturalVoiceSAPIAdapter.msi -OutputDir .\installer-output

    - name: Upload setup artifact
      uses: actions/upload-artifact@v6
      with:
        name: setup-msi
        path: installer-output/NaturalVoiceSAPIAdapter.msi

    - name: Upload setup bootstrapper artifact
      uses: actions/upload-artifact@v6
      with:
        name: setup-exe
        path: |
          installer-output/setup.exe
          installer-output/NaturalVoiceSAPIAdapter.msi

  release:
    runs-on: ubuntu-latest
    needs: [build-sherpa-config, build-utilities, build-main, build-setup]
    # TEMPORARY: Disabled tag check for testing release ZIP creation
    # REVERT BEFORE MERGE: Uncomment the line below to only create releases on tags
    # if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - name: Download all artifacts
      uses: actions/download-artifact@v7
      with:
        path: ${{github.workspace}}/artifacts

    - name: Create ZIP files
      working-directory: ${{github.workspace}}/artifacts
      run: |
        ver="${{github.ref_name}}"
        ver="${ver//\//_}"
        mkdir x86
        mv utilities-x86/* x86/
        mv main-x86/* x86/
        mv x86/Installer.exe ./
        mv x86/InstallPlanRunner.exe ./
        mkdir x64
        mv utilities-x64/* x64/
        mv main-x64/* x64/
        zip -r NaturalVoiceSAPIAdapter_${ver}_x86_x64.zip x86 x64 Installer.exe InstallPlanRunner.exe -i "*.exe" "*.dll" "*.json"
        mkdir ARM64
        mv utilities-ARM64/* ARM64/
        mv main-ARM64/* ARM64/
        zip -r NaturalVoiceSAPIAdapter_${ver}_ARM64.zip x86 x64 ARM64 Installer.exe InstallPlanRunner.exe -i "*.exe" "*.dll" "*.json"
        zip -r debug_symbols.zip x86 x64 ARM64 -i "*.pdb"
        cp setup-msi/NaturalVoiceSAPIAdapter.msi ./
        cp setup-exe/setup.exe ./
        # Canonical release payload layout (single package).
        zip -r NaturalVoiceSAPIAdapter_${ver}_release-layout.zip x86 x64 ARM64 Installer.exe InstallPlanRunner.exe setup.exe NaturalVoiceSAPIAdapter.msi -i "*.exe" "*.dll" "*.json" "*.msi"

    - name: Create release
      # TEMPORARY: Disabled for testing - ZIPs will be available as artifacts only
      # REVERT BEFORE MERGE: Uncomment the uses: line below to create GitHub releases
      if: false
      uses: softprops/action-gh-release@v2
      with:
        body_path: ${{github.workspace}}/release_notes.md
        files: |
          ${{github.workspace}}/artifacts/NaturalVoiceSAPIAdapter_*_release-layout.zip
          ${{github.workspace}}/artifacts/debug_symbols.zip

    # TEMPORARY: Upload ZIPs as artifacts for testing
    # REVERT BEFORE MERGE: Remove this step when re-enabling GitHub releases
    - name: Upload release ZIPs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: |
          ${{github.workspace}}/artifacts/*.zip
          ${{github.workspace}}/artifacts/NaturalVoiceSAPIAdapter.msi
          ${{github.workspace}}/artifacts/setup.exe

    - name: Upload release layout (unzipped)
      uses: actions/upload-artifact@v4
      with:
        name: release-layout
        path: |
          ${{github.workspace}}/artifacts/x86/**
          ${{github.workspace}}/artifacts/x64/**
          ${{github.workspace}}/artifacts/ARM64/**
          ${{github.workspace}}/artifacts/Installer.exe
          ${{github.workspace}}/artifacts/InstallPlanRunner.exe
          ${{github.workspace}}/artifacts/NaturalVoiceSAPIAdapter.msi
          ${{github.workspace}}/artifacts/setup.exe
