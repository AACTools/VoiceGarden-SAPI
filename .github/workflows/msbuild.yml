name: MSBuild

on:
  push:
    branches: [ "master", "main", "feature/**" ]
    tags: ["v[0-9]**"]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-sherpa-config:
    name: Build SherpaOnnxConfig
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Build SherpaOnnxConfig (self-contained, x64)
      run: dotnet publish SherpaOnnxConfig\SherpaOnnxConfig.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ${{github.workspace}}\sherpa-config

    - name: Copy merged_models.json (single-file publish drops it)
      shell: pwsh
      run: Copy-Item SherpaOnnxConfig\merged_models.json sherpa-config\ -Force

    - name: Verify Sherpa integration checks
      shell: pwsh
      run: .\scripts\verify-sherpa-integration.ps1 -SkipBuild

    - uses: actions/upload-artifact@v4
      with:
        name: sherpa-onnx-config
        path: |
          sherpa-config/SherpaOnnxConfig.exe
          sherpa-config/merged_models.json

  build-engine-config:
    name: Build EngineConfig
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build EngineConfig (self-contained, x64)
        run: dotnet publish EngineConfig\EngineConfig.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o engine-config

      - uses: actions/upload-artifact@v4
        with:
          name: engine-config
          path: engine-config/EngineConfig.exe

  build-voice-garden-ui:
    name: Build VoiceGarden.UI
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build DotNetTtsWrapper from source (v1.3.0 not yet on NuGet.org)
      shell: pwsh
      run: |
        $repoDir = Join-Path (Get-Location) ".." "dotnet-tts-wrapper"
        git clone --depth 1 https://github.com/AACTools/dotnet-tts-wrapper.git $repoDir
        $artifactsDir = Join-Path $repoDir "artifacts"
        dotnet pack (Join-Path $repoDir "src/DotNetTtsWrapper.Core/DotNetTtsWrapper.Core.csproj") -c Release -o $artifactsDir
        Write-Host "Artifacts at: $artifactsDir"
        Get-ChildItem $artifactsDir -Filter "*.nupkg" | ForEach-Object { Write-Host "  $($_.Name)" }
        dotnet nuget add source $artifactsDir --name local-tts

    - name: Publish VoiceGarden.UI (self-contained, x64)
      run: |
        dotnet publish VoiceGarden.UI\VoiceGarden.UI.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=false -o ${{github.workspace}}\ui-publish

    - name: Copy branding.json
      shell: pwsh
      run: |
        if (Test-Path config\branding.json) {
          Copy-Item config\branding.json ui-publish\ -Force
        }

    - uses: actions/upload-artifact@v4
      with:
        name: voice-garden-ui
        path: ui-publish/VoiceGarden.UI.exe

  build-utilities:
    name: Build submodules
    runs-on: windows-2022
    needs: [build-sherpa-config, build-engine-config]
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [x86, x64, ARM64]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build AzureSpeechSDKShim (x64)
      if: matrix.platform == 'x64'
      working-directory: ${{github.workspace}}\AzureSpeechSDKShim
      run: |
        nuget restore AzureSpeechSDKShim.sln
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 /p:OutDir=${{github.workspace}}\out\ AzureSpeechSDKShim.sln

    - name: Build AzureSpeechSDKShim (x86)
      if: matrix.platform == 'x86'
      working-directory: ${{github.workspace}}\AzureSpeechSDKShim
      run: |
        nuget restore AzureSpeechSDKShim.sln
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x86 /p:OutDir=${{github.workspace}}\out\ AzureSpeechSDKShim.sln

    - name: Build Arm64XForwarder (ARM64 only)
      if: matrix.platform == 'ARM64'
      working-directory: ${{github.workspace}}
      run: |
        nuget restore Arm64XForwarder -SolutionDirectory .
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=ARM64EC /p:OutDir=${{github.workspace}}\out\ Arm64XForwarder

    - name: Download SherpaOnnxConfig and copy to utilities output
      if: matrix.platform == 'x86' || matrix.platform == 'x64'
      uses: actions/download-artifact@v4
      with:
        name: sherpa-onnx-config
        path: ${{github.workspace}}\out\

    - name: Download EngineConfig and copy to utilities output
      if: matrix.platform == 'x86' || matrix.platform == 'x64'
      uses: actions/download-artifact@v4
      with:
        name: engine-config
        path: ${{github.workspace}}\out\

    - name: Download Sherpa model metadata for ARM64 utilities
      if: matrix.platform == 'ARM64'
      uses: actions/download-artifact@v4
      with:
        name: sherpa-onnx-config
        path: ${{github.workspace}}\out\

    - name: Keep only merged_models.json in ARM64 utilities
      if: matrix.platform == 'ARM64'
      shell: pwsh
      run: Remove-Item out\SherpaOnnxConfig.exe -ErrorAction SilentlyContinue

    - name: Copy branding.json to output
      if: matrix.platform == 'x86'
      shell: pwsh
      run: |
        if (Test-Path .\config\branding.json) {
          Copy-Item -Path .\config\branding.json -Destination out\branding.json -Force
        }

    - uses: actions/upload-artifact@v4
      with:
        name: utilities-${{matrix.platform}}
        path: out

  build-main:
    name: Build VoiceGardenSAPIAdapter DLL
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [x86, x64, ARM64]
    steps:
    - uses: actions/checkout@v4

    - name: Download SherpaOnnx dependencies
      shell: pwsh
      run: |
        $platform = "${{matrix.platform}}"
        .\download-sherpa-deps.ps1 -Platforms $platform

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{github.workspace}}
      run: nuget restore VoiceGardenSAPIAdapter -SolutionDirectory .

    - name: Build C++ adapter DLL
      working-directory: ${{github.workspace}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{matrix.platform}} /p:OutDir=${{github.workspace}}\out\ /p:RegisterOutput=false . /t:VoiceGardenSAPIAdapter

    - name: Remove unnecessary DLLs
      working-directory: ${{github.workspace}}\out
      shell: pwsh
      run: |
        $vspath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -property installationPath -latest
        $msvcpath = (Get-ChildItem "$vspath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).FullName
        $dumpbinpath = "$msvcpath\bin\Hostx86\x86\dumpbin.exe"
        $dlls = & $dumpbinpath /dependents VoiceGardenSAPIAdapter.dll Microsoft.CognitiveServices.*.dll `
          | ? { $_ -like "    *.dll" } | % { $_.Trim() } | Select-Object -Unique
        $dlls += "VoiceGardenSAPIAdapter.dll", "Microsoft.CognitiveServices.*.dll"
        $dlls += "sherpa-onnx-c-api.dll", "onnxruntime.dll", "onnxruntime_providers_shared.dll"
        Remove-Item * -Include *.dll -Exclude $dlls
        Remove-Item Microsoft.CognitiveServices.Speech.extension.codec.dll -ErrorAction Ignore
        exit 0

    - name: Copy ucrtbase.dll (x64)
      if: matrix.platform == 'x64'
      shell: pwsh
      run: Copy-Item -Path "$env:SystemRoot\System32\ucrtbase.dll" -Destination out\

    - name: Copy ucrtbase.dll (x86)
      if: matrix.platform == 'x86'
      shell: pwsh
      run: Copy-Item -Path "$env:SystemRoot\SysWOW64\ucrtbase.dll" -Destination out\

    - uses: actions/upload-artifact@v4
      with:
        name: main-${{matrix.platform}}
        path: out

  build-dotnet-adapter:
    name: Build .NET TTS Adapter
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish .NET adapter
      shell: pwsh
      run: |
        $rid = "${{matrix.platform}}" -eq "x86" ? "win-x86" : "win-x64"
        dotnet publish VoiceGardenSAPIAdapter.Net\VoiceGardenSAPIAdapter.Net.csproj `
          -c ${{env.BUILD_CONFIGURATION}} `
          -r $rid `
          --self-contained false `
          -o ${{github.workspace}}\out

    - uses: actions/upload-artifact@v4
      with:
        name: dotnet-adapter-${{matrix.platform}}
        path: out

  build-setup:
    name: Build MSI setup
    runs-on: windows-2022
    needs: [build-sherpa-config, build-engine-config, build-voice-garden-ui, build-utilities, build-main, build-dotnet-adapter]
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{github.workspace}}\artifacts

    - name: Compose setup payload
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        New-Item -ItemType Directory -Force -Path payload\x86 | Out-Null
        New-Item -ItemType Directory -Force -Path payload\x64 | Out-Null
        New-Item -ItemType Directory -Force -Path payload\ARM64 | Out-Null

        # C++ adapter DLLs + utilities per platform
        Copy-Item artifacts\utilities-x86\* payload\x86\ -Recurse -Force
        Copy-Item artifacts\main-x86\* payload\x86\ -Recurse -Force
        Copy-Item artifacts\utilities-x64\* payload\x64\ -Recurse -Force
        Copy-Item artifacts\main-x64\* payload\x64\ -Recurse -Force
        Copy-Item artifacts\utilities-ARM64\* payload\ARM64\ -Recurse -Force
        Copy-Item artifacts\main-ARM64\* payload\ARM64\ -Recurse -Force

        # .NET adapter files (but preserve C++ adapter's native SherpaOnnx DLLs)
        $nativeDlls = @("sherpa-onnx-c-api.dll", "sherpa-onnx.dll", "onnxruntime.dll", "onnxruntime_providers_shared.dll")
        Get-ChildItem artifacts\dotnet-adapter-x86 -File | Where-Object { $_.Name -notin $nativeDlls } | ForEach-Object { Copy-Item $_.FullName payload\x86\ -Force }
        Get-ChildItem artifacts\dotnet-adapter-x86 -Directory | ForEach-Object { Copy-Item $_.FullName payload\x86\ -Recurse -Force }
        Get-ChildItem artifacts\dotnet-adapter-x64 -File | Where-Object { $_.Name -notin $nativeDlls } | ForEach-Object { Copy-Item $_.FullName payload\x64\ -Force }
        Get-ChildItem artifacts\dotnet-adapter-x64 -Directory | ForEach-Object { Copy-Item $_.FullName payload\x64\ -Recurse -Force }

        # VoiceGarden.UI.exe (the main configuration app)
        Copy-Item artifacts\voice-garden-ui\VoiceGarden.UI.exe payload\ -Force

        # Branding
        if (Test-Path payload\x86\branding.json) {
          Copy-Item payload\x86\branding.json payload\branding.json -Force
        } elseif (Test-Path .\config\branding.json) {
          Copy-Item .\config\branding.json payload\branding.json -Force
        }

    - name: Build MSI
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        .\scripts\build-setup.ps1 -PayloadDir .\payload -OutputDir .\installer-output

    - name: Build setup.exe bootstrapper
      shell: pwsh
      working-directory: ${{github.workspace}}
      run: |
        .\scripts\build-bootstrapper.ps1 -MsiPath .\installer-output\VoiceGardenSAPIAdapter.msi -OutputDir .\installer-output

    - uses: actions/upload-artifact@v4
      with:
        name: setup-msi
        path: installer-output/VoiceGardenSAPIAdapter.msi

    - uses: actions/upload-artifact@v4
      with:
        name: setup-exe
        path: |
          installer-output/setup.exe
          installer-output/VoiceGardenSAPIAdapter.msi
          installer-output/branding.json

  release:
    runs-on: ubuntu-latest
    needs: [build-setup]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ${{github.workspace}}/artifacts

    - name: Create ZIP files
      working-directory: ${{github.workspace}}/artifacts
      run: |
        ver="${{github.ref_name}}"
        ver="${ver//\//_}"

        # Compose x86 + x64 payload
        mkdir -p x86 x64 ARM64
        cp -r utilities-x86/* x86/ 2>/dev/null || true
        cp -r main-x86/* x86/ 2>/dev/null || true
        cp -r utilities-x64/* x64/ 2>/dev/null || true
        cp -r main-x64/* x64/ 2>/dev/null || true
        cp -r utilities-ARM64/* ARM64/ 2>/dev/null || true
        cp -r main-ARM64/* ARM64/ 2>/dev/null || true

        # VoiceGarden.UI.exe goes to payload root
        cp voice-garden-ui/VoiceGarden.UI.exe . 2>/dev/null || true

        # MSI + setup.exe
        cp setup-msi/VoiceGardenSAPIAdapter.msi . 2>/dev/null || true
        cp setup-exe/setup.exe . 2>/dev/null || true
        cp setup-exe/branding.json . 2>/dev/null || true

        # Debug symbols
        zip -r debug_symbols.zip x86 x64 ARM64 -i "*.pdb"

        # Release payload
        zip -r VoiceGardenSAPIAdapter_${ver}_release-layout.zip \
          x86 x64 ARM64 VoiceGarden.UI.exe setup.exe VoiceGardenSAPIAdapter.msi \
          branding.json \
          -i "*.exe" "*.dll" "*.json" "*.msi"

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        body_path: ${{github.workspace}}/release_notes.md
        files: |
          ${{github.workspace}}/artifacts/VoiceGardenSAPIAdapter_*_release-layout.zip
          ${{github.workspace}}/artifacts/debug_symbols.zip

    - uses: actions/upload-artifact@v4
      with:
        name: release-layout
        path: |
          ${{github.workspace}}/artifacts/x86/**
          ${{github.workspace}}/artifacts/x64/**
          ${{github.workspace}}/artifacts/ARM64/**
          ${{github.workspace}}/artifacts/VoiceGarden.UI.exe
          ${{github.workspace}}/artifacts/branding.json
          ${{github.workspace}}/artifacts/VoiceGardenSAPIAdapter.msi
          ${{github.workspace}}/artifacts/setup.exe
